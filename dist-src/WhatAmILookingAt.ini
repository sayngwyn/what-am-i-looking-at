; What Am I Looking At: settings. Every key is optional; a missing key keeps the default shown here.
[General]
; 0 turns the plugin off completely.
Enabled=1
; 1 = with the console open, left-click an object, bare ground, water or the sky to inspect it. The card is drawn only while the console is open.
ConsoleClick=1

; ---- Console output ----------------------------------------------------------------------------------------
; 1 = print [What Am I Looking At] lines in the in-game console after a pick. 0 = print nothing there.
PrintToConsole=1
; With the card on, the console gets one short line (name, part n of m, where the full report is).
; 1 = print the whole report as well. The card and last-pick.json always have everything.
FullConsoleReport=0
; 1 = write last-pick.json (full detail of the latest pick) to the output folder.
WriteJson=1
; How many other parts of the model get a line in the console when the full report prints (the JSON always lists all).
MaxListedParts=60
; 1 = print how the pick ray was built in the full report (useful while checking the picking is right).
ShowRayLine=1
; How far a pick looks (a click or the lookingat command), in game units.
HotkeyMaxDistance=6000
; Where last-pick.json and card-layout.json go. Empty = Documents\My Games\<edition>\SKSE\WhatAmILookingAt\
OutputFolder=

; ---- The card ----------------------------------------------------------------------------------------------
; 1 = show the on-screen card after a pick (only while the console is open). 0 = console lines and JSON only.
ShowCard=1
; Card size multiplier on top of the automatic scale (screen height / 1080), 0.75 to 2. Only the first-run
; default: with the console open, drag the card by its header, drag its edges or corner to resize it, press the
; A buttons in its header or hold Ctrl and turn the mouse wheel over it; that is remembered in card-layout.json
; next to last-pick.json (delete that file, or type lookingat card_reset in the console; lookingat scale_150 sets the size to 150 percent, to start over).
CardScale=1.0
; Where the card starts until you move it: top-right, top-left, bottom-left or bottom-right.
CardCorner=top-right
