; What Am I Looking At (Fallout 4): settings. Every key is optional; a missing key keeps the default shown here.
; Fallout 4 build. A console tool: open the console (~), click an object, bare ground, water or the sky, or type lookingat.
[General]
; 0 turns the plugin off completely.
Enabled=1
; 1 = with the console open, left-click an object, bare ground, water or the sky to inspect it. The card is drawn only while the console is open.
ConsoleClick=1

; ---- Console output ----------------------------------------------------------------------------------------
; 1 = print [What Am I Looking At] lines in the in-game console after a pick. 0 = print nothing there.
PrintToConsole=1
; With the card on, the console gets one short line. 1 = print the whole report as well.
FullConsoleReport=0
; 1 = write last-pick.json (full detail of the latest pick) to the output folder.
WriteJson=1
; How many other parts of the model get a line in the console when the full report prints.
MaxListedParts=60
; 1 = print how the pick ray was built in the full report.
ShowRayLine=1
; How far a pick looks (a click or the lookingat command), in game units.
HotkeyMaxDistance=6000
; Where last-pick.json and card-layout.json go. Empty = Documents\My Games\Fallout4\F4SE\WhatAmILookingAt\
OutputFolder=

; ---- The card ----------------------------------------------------------------------------------------------
; 1 = show the on-screen card after a pick (only while the console is open). 0 = console lines and JSON only.
ShowCard=1
; Card size multiplier on top of the automatic scale (screen height / 1080), 0.75 to 2. Only the first-run default.
CardScale=1.0
; Where the card starts until you move it: top-right, top-left, bottom-left or bottom-right.
CardCorner=top-right
; 1 = show a fixed sample report (a made-up object, labeled as a sample) whenever the console is open, for checking that the card
; draws. Leave 0 for normal use.
ShowSampleCard=0
